[project]
name = "ai-toolkit-xpu"
version = "0.12.27+xpu"
description = "ai-toolkit (ostris) with Intel Arc / oneAPI (XPU) support"
requires-python = ">=3.11,<3.14"   # 3.11/3.12/3.13 均可；用 uv python pin 切换
dependencies = [
    # ---- XPU 后端：这些走 PyTorch XPU 索引（见 [tool.uv.sources]）----
    "torch==2.13.0+xpu",
    "torchvision==0.28.0+xpu",
    "torchaudio==2.11.0+xpu",
    "triton-xpu==3.7.2",
    "torchao==0.17.0+xpu",

    # ---- 以下跟随官方（PyPI / git）----
    "safetensors",
    "diffusers @ git+https://github.com/huggingface/diffusers.git@c943837899b16cbae2f619b8dd4f7bb6f07dd81a",
    "transformers==5.5.3",
    "lycoris-lora==1.8.3",
    "flatten_json",
    "pyyaml",
    "oyaml",
    "tensorboard",
    "kornia",
    "invisible-watermark",
    "einops",
    "accelerate",
    "toml",
    "albumentations==1.4.15",
    "albucore==0.0.16",
    "pydantic",
    "omegaconf",
    "open_clip_torch",
    "timm==1.0.22",
    "prodigyopt",
    "controlnet_aux==0.0.10",
    "python-dotenv",
    # bitsandbytes：多后端轮子（py3-none-win_amd64），3.11-3.13 都能装。
    # XPU 上运行时会由补丁回退/绕过（optimizer.py 先回退标准优化器，
    # custom_adapter.py 禁用 4bit），保留它作兜底与后续开发用。
    "bitsandbytes",
    "hf_transfer",
    "lpips",
    "pytorch_fid",
    "optimum-quanto==0.2.4",
    "sentencepiece",
    "huggingface_hub==1.23.0",
    "peft==0.18.1",
    "gradio",
    "python-slugify",
    "opencv-python",
    "pytorch-wavelets==1.3.0",
    "matplotlib==3.10.1",
    "setuptools>=77.0.3",
    "av==16.0.1",
    "torchcodec==0.15.0",
    "librosa==0.11.0",
    "mutagen==1.47.0",
    # 官方钉 scipy==1.12.0，但该版本没有 cp313 轮子（也不会在 3.13 上编译成功）
    # → 3.13 环境放开到 >=1.14（首个支持 3.13 的系列）
    "scipy>=1.14",
]

[tool.uv]
# 这是脚本式仓库，不把仓库自身当作可安装包
package = false

[[tool.uv.index]]
name = "xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true          # 该索引只用于下面显式指定的包；其余走 PyPI，避免 torchcodec 之类的索引冲突

[tool.uv.sources]
torch = { index = "xpu" }
torchvision = { index = "xpu" }
torchaudio = { index = "xpu" }
torchao = { index = "xpu" }
triton-xpu = { index = "xpu" }
