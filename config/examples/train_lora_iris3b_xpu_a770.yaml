# Iris-3B（像素空间 3B 文生图）在 Intel Arc A770 16GB 上的训练模板。
# 文本编码器 Qwen3-VL-4B 与 Krea 2 共用；VAE 为恒等映射，不额外加载。
---
job: extension
config:
  name: iris3b_xpu
  process:
    - type: sd_trainer
      training_folder: "output"
      disable_sampling: false
      device: xpu
      network:
        type: lora
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 3
      datasets:
        - folder_path: "/path/to/your/dataset"
          caption_ext: txt
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          cache_text_embeddings: true
          resolution: [512]
          num_repeats: 1
      train:
        batch_size: 1
        steps: 1500
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        unload_text_encoder: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        lr: 1e-4
        dtype: bf16
        timestep_type: shift
      logging:
        use_ui_logger: true
        log_every: 1
      model:
        name_or_path: "speridlabs/iris-3b"
        arch: iris3b
        quantize: true
        qtype: xpu_int8
        quantize_te: true
        qtype_te: xpu_int8
        layer_offloading: true
        layer_offloading_transformer_percent: 1.0
        layer_offloading_text_encoder_percent: 1.0
        low_vram: false
        model_kwargs: {}
      sample:
        sampler: flowmatch
        sample_every: 250
        sample_start_step: 250
        width: 512
        height: 512
        prompts:
          - "a cinematic photo of a mountain temple at dawn"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 3.0
        sample_steps: 30
  meta:
    name: "[name]"
    version: "1.0"
