# FLUX.3 Image Klein 在 Intel Arc（A770 16GB）上的推荐训练配置
# 实测（A770、xpu_int8、100% 层级卸载、LoRA r16、batch 1、开 latent/TE 缓存）：
#   512 档（分桶 384×672）  2 步 4.41–5.34 s/it，显存峰值 8.1GB，内存峰值 13.6GB
#
# 前置：
#   1) 可选装 XPU int8 加速轮子（见 wheels/README.md），没装会自动回退 torchao int8；
#   2) MODELS_PATH 指向 ComfyUI models 目录，加载器会**递归**找本地单文件：
#        transformer: diffusion_models/flux3_image_klein_bf16.safetensors
#                     （或 _int8_convrot / _nvfp4；_sd_* 是蒸馏版，不能当底模）
#        VAE        : vae/**/flux2-vae.safetensors
#        TE         : text_encoders/**/qwen3vl_4b_bf16.safetensors
#      配置与 tokenizer 走 HF 的 Qwen/Qwen3-VL-4B-Instruct（一次性缓存）。
---
job: extension
config:
  name: flux3_xpu
  process:
    - type: sd_trainer
      training_folder: "output"
      disable_sampling: false
      device: xpu
      network:
        type: lora
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 500
        max_step_saves_to_keep: 3
      datasets:
        - folder_path: "/path/to/your/dataset"   # 改成你的素材目录（图片 + 同名 .txt 打标）
          caption_ext: txt
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true            # 必开：省下每步的编码开销
          cache_text_embeddings: true
          resolution:
            - 512
          num_repeats: 1
      train:
        batch_size: 1
        steps: 1500
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        unload_text_encoder: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        lr: 1e-4
        dtype: bf16
      logging:
        use_ui_logger: true
        log_every: 1
      model:
        name_or_path: "black-forest-labs/flux-3-image-klein-base"
        arch: flux3
        quantize: true
        qtype: xpu_int8
        quantize_te: true
        qtype_te: xpu_int8
        layer_offloading: true
        layer_offloading_transformer_percent: 1.0
        layer_offloading_text_encoder_percent: 1.0
        low_vram: false
        model_kwargs: {}
      sample:
        sampler: flowmatch
        sample_every: 500
        sample_start_step: 500
        width: 1024
        height: 1024
        prompts:
          - "a cinematic photo of a mountain temple at dawn"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 3.5
        sample_steps: 28
  meta:
    name: "[name]"
    version: '1.0'
