# Qwen-Image 2.1 Turbo + 官方训练适配器，A770 16GB 模板。
# Turbo 的收益主要是固定 8 步采样；反向训练成本与普通 2.1 同量级。
---
job: extension
config:
  name: qwen21_turbo_xpu
  process:
    - type: sd_trainer
      training_folder: "output"
      disable_sampling: false
      device: xpu
      network:
        type: lora
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "/path/to/your/dataset"
          caption_ext: txt
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          cache_text_embeddings: true
          resolution: [512, 768]
          num_repeats: 1
      train:
        batch_size: 1
        steps: 1500
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        unload_text_encoder: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        lr: 1e-4
        dtype: bf16
      logging:
        use_ui_logger: true
        log_every: 1
      model:
        name_or_path: "Comfy-Org/Qwen-Image-2.1/diffusion_models/qwen_image_2.1_turbo_bf16.safetensors"
        arch: qwen_image_2:turbo
        assistant_lora_path: "ostris/qwen_image_2_turbo_training_adapter/qwen_image_2_turbo_training_adapter_v1.safetensors"
        quantize: true
        qtype: xpu_int8
        quantize_te: true
        qtype_te: xpu_int8
        layer_offloading: true
        layer_offloading_transformer_percent: 1.0
        layer_offloading_text_encoder_percent: 1.0
        low_vram: false
        model_kwargs:
          turbo: true
          rgba: false
      sample:
        sampler: flowmatch
        sample_every: 250
        sample_start_step: 250
        width: 768
        height: 768
        prompts:
          - "a cinematic photo of a mountain temple at dawn"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 1.0
        sample_steps: 8
  meta:
    name: "[name]"
    version: "1.0"
